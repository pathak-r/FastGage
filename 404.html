<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found &mdash; FastGage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: var(--max);
      margin: 0 auto;
      width: 100%;
      padding: 4rem 1.5rem;
    }
    .not-found h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(4rem, 12vw, 7rem);
      letter-spacing: -0.05em;
      line-height: 0.9;
    }
    .not-found p {
      margin: 0 0 2rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="not-found">
    <h1>404</h1>
    <p>That page isn't here.</p>
    <a class="action" href="/">
      <span class="action-mark" aria-hidden="true"></span>
      Back to FastGage
    </a>
  </main>
</body>
</html>
